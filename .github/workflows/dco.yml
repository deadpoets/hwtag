name: DCO
on: [pull_request]
permissions:
  contents: read
jobs:
  signoff:
    name: Every commit is signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          bad=0
          for c in $(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: .* <.*@.*>$' || { echo "missing Signed-off-by: $c"; bad=1; }
          done
          exit $bad
