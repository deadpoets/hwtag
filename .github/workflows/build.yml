name: Release binaries
# Reproducible: CGO_ENABLED=0 -trimpath -buildvcs=false with the toolchain
# pinned in go.mod. Building the same tag anywhere gives the same bytes, and
# the sha256 sums are attached to the release so anyone can check.
on:
  release:
    types: [published]
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {GOOS: windows, GOARCH: amd64, ext: .exe, cmds: age-plugin-tpm age-plugin-ykpiv}
          - {GOOS: windows, GOARCH: arm64, ext: .exe, cmds: age-plugin-tpm age-plugin-ykpiv}
          - {GOOS: linux, GOARCH: amd64, ext: "", cmds: age-plugin-tpm}
          - {GOOS: linux, GOARCH: arm64, ext: "", cmds: age-plugin-tpm}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          VERSION="$(git describe --tags --always)"
          mkdir -p out
          for cmd in ${{ matrix.cmds }}; do
            go build -trimpath -buildvcs=false -ldflags "-X main.version=$VERSION" \
              -o "out/$cmd-$VERSION-$GOOS-$GOARCH${{ matrix.ext }}" "./cmd/$cmd"
          done
          cp LICENSE out/
          (cd out && sha256sum * > "sha256sums-$GOOS-$GOARCH.txt" && cat "sha256sums-$GOOS-$GOARCH.txt")
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
      - uses: actions/upload-artifact@v7
        with:
          name: hwtag-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          path: out/*
  upload:
    name: Upload release assets
    if: github.event_name == 'release'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hwtag-*
          merge-multiple: true
      - run: gh release upload "$GITHUB_REF_NAME" age-plugin-* sha256sums-*
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
