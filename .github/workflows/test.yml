name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    name: Test (TPM simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install pcsclite (piv-go needs it on Linux)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Install age (the script tests exec it; 1.3+ for age1tag1 recipients)
        run: |
          go install filippo.io/age/cmd/age@v1.3.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Tests with the simulator and the race detector
        run: CGO_ENABLED=1 go test -race -tags agetpmsim ./...
      - name: Tests as the production build sees them (no simulator, no cgo; ykpiv needs cgo on Linux)
        run: CGO_ENABLED=0 go test ./plugin
      - name: Fuzz seeds and corpus
        run: go test -run '^Fuzz' ./plugin ./ykpiv
      - name: go vet (linux, windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          CGO_ENABLED=1 go vet -tags agetpmsim ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          GOOS=windows govulncheck ./...
  # A separate job rather than a matrix on test: a matrix would rename
  # "Test (TPM simulator)", which the ruleset on main requires by name.
  # Hosted runners expose no TPM and no YubiKey, so TBS and winscard are only
  # compiled here; the real-hardware run stays with the maintainer.
  windows:
    name: Test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The simulator's C code links OpenSSL, which the runner's preinstalled
      # MinGW lacks; MSYS2's mingw64 is what the maintainer builds with too.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl
      - name: Put MSYS2's mingw64 first on PATH
        run: cygpath -w '${{ steps.msys2.outputs.msys2-location }}/mingw64/bin' >> "$GITHUB_PATH"
      - name: Install age (the script tests exec it; 1.3+ for age1tag1 recipients)
        run: |
          go install filippo.io/age/cmd/age@v1.3.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Tests as the production build sees them (no cgo; ykpiv is pure Go on Windows)
        run: CGO_ENABLED=0 go test ./plugin ./ykpiv ./internal/...
      - name: Tests with the simulator and the race detector
        run: CGO_ENABLED=1 go test -race -tags agetpmsim ./...
      - name: go vet
        run: |
          go vet ./...
          CGO_ENABLED=1 go vet -tags agetpmsim ./...
  cross:
    name: Cross-build (no cgo)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {GOOS: windows, GOARCH: amd64, pkgs: ./cmd/age-plugin-tpm ./cmd/age-plugin-ykpiv}
          - {GOOS: windows, GOARCH: arm64, pkgs: ./cmd/age-plugin-tpm ./cmd/age-plugin-ykpiv}
          - {GOOS: linux, GOARCH: amd64, pkgs: ./cmd/age-plugin-tpm}
          - {GOOS: linux, GOARCH: arm64, pkgs: ./cmd/age-plugin-tpm}
          - {GOOS: darwin, GOARCH: arm64, pkgs: ./cmd/age-plugin-tpm}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -trimpath -buildvcs=false -o /dev/null ${{ matrix.pkgs }}
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
